[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synthetic-route-service"
version = "0.1.0"
description = "A hierarchical in-memory routing service for a debugging exercise."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config -ra"

[tool.hatch.build.targets.wheel]
packages = ["src/route_service"]
