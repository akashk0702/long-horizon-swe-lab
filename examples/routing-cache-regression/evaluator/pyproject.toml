[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "routing-regression-evaluator"
version = "0.1.0"
description = "Operator-owned behavioral checks for the routing regression exercise."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/routing_regression_evaluator"]
