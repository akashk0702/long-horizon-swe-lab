[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synthetic-metadata-pipeline"
version = "0.1.0"
description = "An ordered metadata enrichment pipeline for an optimization exercise."
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config -ra"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_pipeline"]
