name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependency manager
        run: python -m pip install uv==0.11.28
      - name: Reproduce locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest --ignore=tests/test_tenant_quota_task.py --ignore=tests/test_routing_regression_task.py
      - name: Validate tenant quota task and weak solutions
        run: uv run --locked pytest tests/test_tenant_quota_task.py -v
      - name: Validate routing regression and alternate repairs
        run: uv run --locked pytest tests/test_routing_regression_task.py -v
      - name: Build distribution
        run: uv build --no-sources
