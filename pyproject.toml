[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "long-horizon-swe-lab"
version = "0.1.0a1"
description = "A reproducible framework for evaluating autonomous software-engineering workflows on multi-step repository-level tasks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Akash Kumar"}]
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.3,<7"]

[project.scripts]
long-swe = "long_horizon_swe.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6.0.12", "tenant-quota-evaluator", "routing-regression-evaluator", "metadata-optimization-evaluator"]

[tool.uv.sources]
tenant-quota-evaluator = {path = "examples/tenant-quota-service/evaluator"}
routing-regression-evaluator = {path = "examples/routing-cache-regression/evaluator"}
metadata-optimization-evaluator = {path = "examples/metadata-batch-optimization/evaluator"}

[tool.hatch.build.targets.wheel]
packages = ["src/long_horizon_swe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "examples/metadata-batch-optimization/evaluator/src", "examples/metadata-batch-optimization/benchmark/run_benchmark.py"]
